<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filming Scripts</title>
  <style>
    :root { --bg: #140d1c; --ink: #f3ead8; --muted: #b7a6c9; --gold: #e9c46a; --line: #3d2c57; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 "Iowan Old Style", Palatino, Georgia, serif; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    h1, h2 { color: var(--gold); line-height: 1.2; }
    h1 { font-size: 1.8rem; } h2 { font-size: 1.35rem; margin-top: 2em; border-top: 1px solid var(--line); padding-top: 1em; }
    a { color: var(--gold); }
    blockquote { margin: 1em 0; padding: 8px 14px; border-left: 4px solid var(--gold); background: #261a3a; border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; font: 14px/1.4 -apple-system, system-ui, sans-serif; margin: 1em 0; }
    td, th { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
    code { background: #261a3a; padding: 1px 5px; border-radius: 4px; }
    p { margin: .7em 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
    .gate { text-align: center; padding: 24px; border: 2px dashed #e5484d; border-radius: 16px; margin: 2em 0; }
    .gate button { font: 700 1rem -apple-system, system-ui, sans-serif; padding: 12px 18px; border-radius: 12px; border: 0; background: #e5484d; color: #fff; margin-top: 10px; }
    .top { font: 14px -apple-system, system-ui, sans-serif; display: flex; justify-content: space-between; }
    .top button { font: inherit; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 4px 10px; }
    @media print {
      body { background: #fff; color: #000; } h1, h2, a { color: #000; } blockquote, code { background: #f2f2f2; }
      .top, .gate { display: none; } #spoilers { display: block !important; } h2 { page-break-before: always; }
    }
  </style>
</head>
<body>
  <main>
    <div class="top"><a href="./">← Back to the game</a><button onclick="window.print()">🖨️ Print</button></div>
    <div id="safe">Loading…</div>
    <div class="gate" id="gate" hidden>
      <b>⚠️ The rest of this page reveals who did it in all three endings.</b><br>
      Only the people filming the reveal scenes should open it.<br>
      <button onclick="document.getElementById('spoilers').hidden=false;document.getElementById('gate').hidden=true">I’m not playing. Show the reveal scripts.</button>
    </div>
    <div id="spoilers" hidden></div>
  </main>
  <script>
    // Tiny Markdown renderer: enough for SCRIPTS.md (headings, bold, italics, quotes, tables, lists, rules).
    function inline(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/&lt;br&gt;/g, '<br>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/\*([^*]+)\*/g, '<i>$1</i>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }
    function md(text) {
      const out = [];
      const lines = text.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (/^\s*$/.test(l)) continue;
        if (/^---+\s*$/.test(l)) { out.push('<hr>'); continue; }
        const h = l.match(/^(#{1,3})\s+(.*)/);
        if (h) { out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); continue; }
        if (l.startsWith('|')) {
          const rows = [];
          while (i < lines.length && lines[i].startsWith('|')) { rows.push(lines[i]); i++; }
          i--;
          const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
          out.push('<table><tr>' + cells(rows[0]).map((c) => '<th>' + c + '</th>').join('') + '</tr>' +
            rows.slice(2).map((r) => '<tr>' + cells(r).map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</table>');
          continue;
        }
        if (l.startsWith('>')) {
          const q = [];
          while (i < lines.length && lines[i].startsWith('>')) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
          i--;
          out.push('<blockquote>' + md(q.join('\n')) + '</blockquote>');
          continue;
        }
        if (/^\s*[-*]\s+/.test(l) || /^\d+\.\s+/.test(l)) {
          const ordered = /^\d+\./.test(l);
          const items = [];
          while (i < lines.length && (/^\s*[-*]\s+/.test(lines[i]) || /^\d+\.\s+/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) {
            if (/^\s{2,}\S/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i])) items[items.length - 1] += ' ' + lines[i].trim();
            else items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ''));
            i++;
          }
          i--;
          out.push((ordered ? '<ol>' : '<ul>') + items.map((x) => '<li>' + inline(x) + '</li>').join('') + (ordered ? '</ol>' : '</ul>'));
          continue;
        }
        const para = [l];
        while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#|>|\||---|\s*[-*]\s|\d+\.\s)/.test(lines[i + 1])) { para.push(lines[++i]); }
        out.push('<p>' + inline(para.join(' ')) + '</p>');
      }
      return out.join('\n');
    }
    fetch('SCRIPTS.md', { cache: 'no-cache' }).then((r) => r.text()).then((t) => {
      const cut = t.indexOf('# ⚠️ SPOILERS BELOW');
      const safe = cut > 0 ? t.slice(0, cut) : t;
      const rest = cut > 0 ? t.slice(cut).split('\n').slice(1).join('\n').replace(/\*\*Players who haven't solved[^\n]*\n/, '') : '';
      document.getElementById('safe').innerHTML = md(safe.replace(/\n---\n---\n*$/, ''));
      if (rest) { document.getElementById('spoilers').innerHTML = md(rest.replace(/<br>/g, '')); document.getElementById('gate').hidden = false; }
    }).catch(() => { document.getElementById('safe').textContent = 'Could not load the scripts.'; });
  </script>
</body>
</html>
