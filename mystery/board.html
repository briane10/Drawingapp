<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marrowby Manor: The Board Game</title>
  <meta name="description" content="Roll the dice, explore the mansion, and solve the mystery. A family board game on the TV, played from everyone's phone.">
  <meta name="theme-color" content="#140d1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marrowby">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <main id="app"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Marrowby Manor needs JavaScript to run.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/story.js"></script>
  <script src="js/store.js"></script>
  <script src="js/board-data.js"></script>
  <script src="js/board-engine.js"></script>
  <script src="js/board-app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
